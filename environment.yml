# Conda environment for the GEOGLOWS RFS retrospective evaluation.
#
#   conda env create -f environment.yml
#   conda activate geoglows-eval
#   python kge_map.py
#
# Everything comes from conda-forge; cartopy in particular is painful via pip
# because it needs GEOS and PROJ as system libraries.
#
# NOTE on ~/.local: this machine has cartopy installed in
# ~/.local/lib/python3.12/site-packages, which leaks into *every* Python 3.12
# environment. That is why `base` appears to work even though cartopy is not
# installed in it. If an import ever resolves to a version you did not expect,
# run with `PYTHONNOUSERSITE=1` to confirm the environment is self-sufficient:
#
#   PYTHONNOUSERSITE=1 python kge_map.py
#
name: geoglows-eval

channels:
  - conda-forge

dependencies:
  - python=3.12

  # core
  - numpy>=1.26
  - pandas>=2.2
  - scipy>=1.11

  # zarr access over plain HTTP.
  # zarr 3 is REQUIRED, not merely allowed: the RFS v3 retrospective is written
  # in zarr FORMAT 3 (a `zarr.json` store rather than `.zgroup`/`.zarray`) and
  # zarr 2.x cannot open it at all -- it raises PathNotFoundError.
  #
  # This was previously pinned <3 because the 3.x rewrite changed the store API.
  # Tested on zarr 3.4.0: `zarr.open(fsspec.get_mapper(url))` still works, and
  # reads BOTH the format-2 v2 store over anonymous HTTP and the format-3 v3
  # store over s3:// with a profile. The pattern this code uses did not break.
  - zarr>=3
  - s3fs           # s3:// stores, for --model-zarr against a private bucket
  - fsspec>=2024.2
  - aiohttp        # fsspec's HTTP filesystem backend
  - requests

  # Observed gauges, read straight from the private bucket. Credentials come
  # from boto's own chain -- a profile, environment variables or an instance
  # role -- never from this repository. Only needed for --gauge-source s3,
  # which is the default when no local gauge directory is present.
  - s3fs>=2024.2

  # serve.py queries the retrospective per reach through this package, and
  # kge_map.py calls geoglows.analyze.gumbel1 and geoglows.bias so the return
  # levels and the bias correction cannot drift from RFS.
  - geoglows>=2.2
  # `import geoglows` pulls in its plotting stack, which imports pytz -- so this
  # is needed even though nothing here plots with geoglows. It is not declared
  # by the package itself, and without it every run dies at the first gumbel1
  # call with ModuleNotFoundError: No module named 'pytz'.
  - pytz

  # file formats
  - pyarrow>=15     # parquet (metrics table, GEOGLOWS model table)
  - openpyxl        # pd.read_excel for master_catalog_with_metadata.xlsx

  # plotting / mapping
  - matplotlib-base>=3.8
  - cartopy>=0.22   # pulls in GEOS + PROJ

  # optional, useful as this grows
  - geopandas
  - xarray
  - dask
