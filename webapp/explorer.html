async function loadSeries(g, wrap) {
  if (!LIVE) {
    // Static build: no /api and no daily values, so use the curves computed at
    // build time. The hydrograph section is not rendered at all in this mode.
    const c = D.curves && D.curves[String(g.id)];
    if (c) drawCurves(wrap, c.fo, c.fs, c.mo, c.ms, D.window, null);
    return;
  }
  let d;
  try {
    const res = await fetch(`/api/series?id=${g.id}`);
    d = await res.json();
    if (d.error) throw new Error(d.error);
  } catch (err) {
    wrap.querySelector("#hy").innerHTML =
      `<div class="err">Could not load the series for reach ${g.id}.<br>${err.message}
       <br><br>The model query goes out to GEOGLOWS, so this needs network access.</div>`;
    return;
  }
  if (S.sel !== g) return;   // selection changed while the request was in flight

  const t0ms = Date.parse(d.t0 + "T00:00:00Z");
  HY.data = {sim:d.sim, obs:d.obs, clim:d.clim, doy0:d.doy0, t0ms};

  // Open on the most recent stretch of observed record rather than the whole
  // series. Eighty-five years of daily values in a 300px panel is an unreadable
  // mat -- individual events only become visible at a few years' width. Zooming
  // out to the full record is one scroll away.
  const DEFAULT_DAYS = 5 * 365;
  let last = -1;
  for (let i = d.obs.length - 1; i >= 0; i--) if (d.obs[i] != null) { last = i; break; }
  if (last < 0) last = d.sim.length - 1;
  HY.i1 = Math.min(d.sim.length, last + 30);
  HY.i0 = Math.max(0, HY.i1 - DEFAULT_DAYS);

  wrap.querySelector("#hy").innerHTML =
    `<canvas id="hycv"></canvas><div class="hint" id="hyhint"></div>`;
  drawHydro(); wireHydro();

  const hlog = wrap.querySelector("#hlog"), hlin = wrap.querySelector("#hlin");
  hlog.onclick = () => { HY.log = true;  hlog.setAttribute("aria-pressed","true");
    hlin.setAttribute("aria-pressed","false"); drawHydro(); };
  hlin.onclick = () => { HY.log = false; hlin.setAttribute("aria-pressed","true");
    hlog.setAttribute("aria-pressed","false"); drawHydro(); };

  // Statistics use the metric window only. The hydrograph above still shows the
  // whole record, but the flow-duration curve and monthly regime must be
  // computed on the same days the metrics were, or the charts describe a
  // different sample from the numbers printed beside them.
  const [w0, w1] = d.win || [0, d.sim.length];
  const simW = d.sim.slice(w0, w1), obsW = d.obs.slice(w0, w1);
  const tW = t0ms + w0 * 86400000;
  const [ps, po] = pairedOnly(simW, obsW);
  drawCurves(wrap, quantiles(po, FDC_EX), quantiles(ps, FDC_EX),
             monthlyMeans(obsW.map((v,i)=>simW[i]!=null?v:null), tW),
             monthlyMeans(simW.map((v,i)=>obsW[i]!=null?v:null), tW),
             d.window, ps.length);
}

// Flow-duration and monthly-regime charts. Live mode derives the four arrays
// from the daily record it just fetched; the static build reads them from the
// payload, where build_webapp.py precomputed them on the same paired sample.
function drawCurves(wrap, fo, fs, mo, ms, window, nPaired) {
  const ex = (D && D.fdcExceed) || FDC_EX;
  const ticks = [0, Math.floor(ex.length/2), ex.length-1].map(i => ({i, label: ex[i]+"%"}));
  const fdc = wrap.querySelector("#fdc");
  if (fdc) fdc.appendChild(lineChart({
    xs: ex, logY: true, xTicks: ticks, yFmt: sig,
    series: [{v: fo, c: cssVar("--ink-2")}, {v: fs, c: cssVar("--accent")}]}));
  const mon = wrap.querySelector("#mon");
  if (mon) mon.appendChild(lineChart({
    xs: MONTHS, h: 118, xTicks: MONTHS.map((l,i)=>({i,label:l})), yFmt: sig,
    series: [{v: mo, c: cssVar("--ink-2")}, {v: ms, c: cssVar("--accent")}]}));

  // Name the sample on both captions. Identical wording over two different
  // samples is exactly the defect this fix exists to remove.
  const win = window || (D && D.window) || null;
  const note = win
    ? `Paired days only, ${win[0]} to ${win[1]}${nPaired ? ` (${nPaired.toLocaleString()} days)` : ""} — the same sample as the metrics above.`
    : "Paired days only.";
  for (const id of ["#fdccap", "#moncap"]) {
    const e = wrap.querySelector(id);
    if (e) e.textContent = note;
  }
}

// Keep the selected reach in the URL, so a particular gauge can be linked to
// and a reload lands back on it.
function syncHash() {
  const want = S.sel ? "#g=" + S.sel.id : "";
  if (location.hash !== want) history.replaceState(null, "", location.pathname + want);
}
const renderRail = () => {
  if (!D) return;
  syncHash();
  S.sel ? renderGauge(S.sel) : renderSummary();
};

/* ---- legend -------------------------------------------------------------- */
function renderLegend() {
  const m = M[S.metric];
  const lg = document.querySelector(".legend");
  if (lg) lg.hidden = needsMonth();   // no scale to show yet
  if (needsMonth()) return;
  document.getElementById("lgLab").textContent = monthLabel();
  const c = document.getElementById("lgbar"), g = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  c.width = 220*dpr; c.height = 11*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  for (let x=0;x<220;x++) { g.fillStyle = interp(rampFor(m), x/219);
    g.fillRect(x,0,1,11); }
  // Five ticks, each placed at the fraction of the bar it names, with its value
  // obtained by INVERTING the transform the bar was drawn with. Three evenly
  // spaced ticks invited the reader to interpolate linearly, which is wrong for
  // every scale here: a diverging ramp gives each arm half the bar regardless of
  // how much value each arm covers, and the log and sqrt ramps are not linear at
  // all. KGE' showed -1, -0.41, 0.85 evenly spaced, so the axis looked broken --
  // -0.41 is nowhere near the arithmetic midpoint of -1 and 0.85.
  const valueAt = t => {
    if (m.seq) {
      if (m.log)  { const a = Math.log10(m.lo), b = Math.log10(m.hi);
                    return Math.pow(10, a + t * (b - a)); }
      if (m.sqrt) return m.lo + t * t * (m.hi - m.lo);
      return m.lo + t * (m.hi - m.lo);
    }
    const c = m.dv;
    return t >= 0.5 ? c + (t - 0.5) * 2 * (m.hi - c)
                    : c - (0.5 - t) * 2 * (c - m.lo);
  };
  const f = v => m.log || m.sqrt || Math.abs(v) < 1e-9 || Number.isInteger(v)
               ? sig(v) : String(Number(v.toFixed(2)));
  const ticks = document.getElementById("lgTicks");
  ticks.innerHTML = "";
  [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    const sp = document.createElement("span");
    sp.className = "num" + (t === 0 ? " t0" : t === 1 ? " t100" : "");
    if (t > 0 && t < 1) sp.style.left = (t * 100) + "%";
    sp.textContent = f(valueAt(t));
    ticks.appendChild(sp);
  });
  const notes = [];
  if (m.k.startsWith("kge")) notes.push(`no skill at ${D.noSkill}`);
  if (m.log) notes.push("log scale");
  if (m.sqrt) notes.push("square-root scale");
  if (m.seq) notes.push(m.pal === "purple" ? "deeper purple = better"
                        : m.pal === "blue" ? "deeper blue = better"
                        : m.pal === "heat" ? "hotter = worse" : "deeper red = larger error");
  // Count the gauges that really are off the ends rather than warning about it
  // unconditionally. POD, CSI and ETS are bounded [0,1] and scaled 0..1, so
  // nothing can be outside -- the old note was noise there and hid the cases
  // where clipping is real, like the 46 gauges above the nrmse ceiling.
  const nOut = D.gauges.reduce((n, g) => {
    const v = g[m.k];
    return n + (v != null && isFinite(v) && (v < m.lo || v > m.hi) ? 1 : 0);
  }, 0);
  if (nOut) notes.push(`${nOut.toLocaleString()} gauge${nOut===1?"":"s"} beyond the ends, drawn at the limit`);
  document.getElementById("lgNote").textContent = notes.join(" · ");
}

/* ---- interaction --------------------------------------------------------- */
const tip = document.getElementById("tip");
let drag = null;

cv.addEventListener("pointerdown", e => {
  drag = {x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty,moved:false};
  cv.classList.add("drag"); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  const r = cv.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top;
  if (drag) {
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    if (Math.abs(dx)+Math.abs(dy) > 3) drag.moved = true;
    view.tx = drag.tx+dx; view.ty = drag.ty+dy; draw(); return;
  }
  const g = needsMonth() ? null : nearest(mx,my);
  if (g !== S.hover) { S.hover = g; draw(); }
  if (g) {
    tip.textContent = `${g.g} · ${fmt(mval(g), M[S.metric].dec)}`;
    tip.style.left = (mx+14)+"px"; tip.style.top = (my+14)+"px"; tip.classList.add("on");
  } else tip.classList.remove("on");
});
cv.addEventListener("pointerup", e => {
  if (drag && !drag.moved) {
    const r = cv.getBoundingClientRect();
    const g = nearest(e.clientX-r.left, e.clientY-r.top);
    S.sel = (g && g === S.sel) ? null : g;
    renderRail();
  }
  drag = null; cv.classList.remove("drag"); draw(); scheduleStreams();
});
cv.addEventListener("pointercancel", () => { drag=null; cv.classList.remove("drag"); });
cv.addEventListener("pointerleave", () => { tip.classList.remove("on");
  if (S.hover) { S.hover=null; draw(); } });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), mx = e.clientX-r.left, my = e.clientY-r.top;
  const ns = Math.max(1, Math.min(40, view.s*Math.exp(-e.deltaY*0.0016))), f = ns/view.s;
  view.tx = mx-(mx-view.tx)*f; view.ty = my-(my-view.ty)*f; view.s = ns; draw(); scheduleStreams();
}, {passive:false});

function zoomBy(k) {
  const ns = Math.max(1, Math.min(40, view.s*k)), f = ns/view.s;
  view.tx = W/2-(W/2-view.tx)*f; view.ty = H/2-(H/2-view.ty)*f; view.s = ns; draw();
  scheduleStreams();
}
document.getElementById("zin").onclick  = () => zoomBy(1.45);
document.getElementById("zout").onclick = () => zoomBy(1/1.45);
document.getElementById("zfit").onclick = () => { view.s=1; view.tx=0; view.ty=0; draw(); scheduleStreams(); };




// Metrics available per calendar month. Everything else is whole-series only.
const MONTHLY = [
  { k: "kge_2012",  n: "KGE'",              scale: "kge_2012",  dec: 2 },
  { k: "ss_clim",   n: "Skill vs climatology", scale: "ss_clim", dec: 2 },
  { k: "nse",       n: "NSE",               scale: "nse",       dec: 2 },
  { k: "r",         n: "Pearson r",         scale: "r",         dec: 2 },
  { k: "spearman",  n: "Spearman \u03c1",   scale: "spearman",  dec: 2 },
  { k: "gamma",     n: "Gamma (CV ratio)",  scale: "gamma",     dec: 2 },
  { k: "alpha",     n: "Alpha (\u03c3 ratio)", scale: "alpha",  dec: 2 },
  { k: "beta",      n: "Beta (bias ratio)", scale: "beta",      dec: 2 },
  { k: "pbias_pct", n: "PBIAS (%)",         scale: "pbias_pct", dec: 1 },
  { k: "nrmse",     n: "NRMSE (\u00f7 mean flow)", scale: "nrmse", dec: 2 },
  { k: "mae_rel",   n: "MAE \u00f7 mean flow", scale: "mae_rel", dec: 2 },
];
// Monthly values arrive as one 12-element array per metric, indexed 0 =
// January, rather than 240 separate keys. Every read goes through here so
// the payload shape is defined in exactly one place.
const monthVal = (g, k, monthIndex) => {
  const a = g[k + "_m"];
  return Array.isArray(a) ? a[monthIndex] : undefined;
};
const MM = i => String(i).padStart(2, "0");

// Per-gauge monthly table: every metric that exists per calendar month.
// Wide, so it scrolls horizontally inside .tblwrap rather than squeezing.
function monthlyTable(g) {
  const box = document.createElement("div");
  box.className = "tblwrap";
  const cols = MONTHLY;
  const head = `<tr><th>Month</th><th>days</th>${cols.map(c =>
      `<th>${c.n.replace(" (bias ratio)","").replace(" (CV ratio)","")
             .replace(" (\u03c3 ratio)"," \u03c3").replace(" vs climatology"," vs clim")
             .replace(" (\u00f7 mean flow)"," \u00f7 mean")}</th>`).join("")}</tr>`;
  const body = MONTH_NAMES.map((nm, i) => {
    const n = monthVal(g, "n", i);
    return `<tr><td>${nm.slice(0,3)}</td>`
      + `<td class="num">${n != null ? n.toLocaleString() : "\u2014"}</td>`
      + cols.map(c => {
          const v = monthVal(g, c.k, i);
          const sw = v != null ? `<span class="swatch" style="background:${colorFor(M[c.scale], v)}"></span>` : "";
          return `<td class="num">${sw}${fmt(v, c.dec)}</td>`;
        }).join("") + `</tr>`;
  }).join("");
  box.innerHTML = `<table class="grid"><thead>${head}</thead><tbody>${body}</tbody></table>`;
  return box;
}

// Flood-detection block, drawn as the 2x2 contingency table the scores come
// from. The four counts are the actual quantity measured; POD/FAR/CSI/ETS are
// each one ratio of them, so showing the table first makes the scores readable
// rather than asking the reader to take four numbers on trust.
function floodBlock(g) {
  const box = document.createElement("div");
  if (g.pod == null) {
    box.innerHTML = `<div class="empty">No flood-detection scores for this gauge
      (fewer than 10 annual maxima, or no positive flood level).</div>`;
    return box;
  }
  const a = g.hits ?? 0, b = g.false_alarms ?? 0, c = g.misses ?? 0, d = g.correct_neg ?? 0;
  const N = (v) => v.toLocaleString();
  box.innerHTML = `
    <table class="ctab">
      <tr>
        <th class="side"></th>
        <th colspan="2">Gauge above its 2-yr level</th>
      </tr>
      <tr>
        <th class="side"></th><th>yes</th><th>no</th>
      </tr>
      <tr>
        <th class="side"><span class="axis">Model yes</span></th>
        <td class="hit"><span class="cnt num">${N(a)}</span><span class="lab">hits</span></td>
        <td><span class="cnt num">${N(b)}</span><span class="lab">false alarms</span></td>
      </tr>
      <tr>
        <th class="side"><span class="axis">Model no</span></th>
        <td><span class="cnt num">${N(c)}</span><span class="lab">misses</span></td>
        <td class="miss"><span class="cnt num">${N(d)}</span><span class="lab">correct negatives</span></td>
      </tr>
    </table>

    <table class="kv" style="margin-top:14px">
      <tr><td>POD &mdash; hits &divide; (hits + misses)</td><td class="num">${fmt(g.pod)}</td></tr>
      <tr><td>FAR &mdash; false alarms &divide; (hits + false alarms)</td><td class="num">${fmt(g.far)}</td></tr>
      <tr><td>CSI &mdash; hits &divide; (all but correct negatives)</td><td class="num">${fmt(g.csi)}</td></tr>
      <tr><td>ETS &mdash; CSI less hits expected by chance</td><td class="num">${fmt(g.ets)}</td></tr>
      <tr><td>Frequency bias &mdash; days flagged, model &divide; gauge</td><td class="num">${fmt(g.freq_bias)}</td></tr>
      <tr><td>2-yr level, observed</td><td><span class="num">${sig(g.t2_obs)}</span> m\u00b3/s</td></tr>
      <tr><td>2-yr level, modelled</td><td><span class="num">${sig(g.t2_sim)}</span> m\u00b3/s</td></tr>
      <tr><td>Annual maxima used</td><td class="num">${N(g.n_years_ams ?? 0)}</td></tr>
    </table>`;
  return box;
}

/* ---- summary tab --------------------------------------------------------- */
// Groupings are the ones asked for: overall, stream order, Koppen group, and
// month. Everything is aggregated here in the browser from the same payload the
// map uses, so no extra fields and no round trip.
//
// Bars are coloured by their own value on the same scale as the map, rather than
// by a categorical season/group palette. Two reasons: the group is already named
// on the axis so a second encoding of it would be redundant, and it keeps one
// visual language across the whole page.
const GROUPINGS = [
  { k: "overall", n: "Overall" },
  { k: "so",      n: "Stream order" },
  { k: "kp",      n: "Köppen group" },
  { k: "month",   n: "Month" },
];
// Month is the one grouping that is cyclical, which is the one case a polar
// layout genuinely earns: December sits next to January, as it should.
const SUM = { group: "so", metric: "kge_2012", monthMetric: "kge_2012" };

const pctl = (v, p) => v.length ? v[Math.min(v.length - 1, Math.round(p * (v.length - 1)))] : null;
function statsFor(vals) {
  const v = vals.filter(x => x != null && isFinite(x)).sort((a, b) => a - b);
  if (!v.length) return null;
  return { n: v.length, p05: pctl(v, .05), p25: pctl(v, .25), med: pctl(v, .5),
           p75: pctl(v, .75), p95: pctl(v, .95) };
}

// Rows for the current grouping: {label, sub, stats, value}
function summaryRows() {
  const gs = D.gauges;
  if (SUM.group === "month") {
    const mo = MONTHLY.find(x => x.k === SUM.monthMetric) || MONTHLY[0];
    return MONTH_NAMES.map((nm, i) => ({
      label: nm.slice(0, 3), full: nm,
      stats: statsFor(gs.map(g => monthVal(g, mo.k, i))),
    }));
  }
  if (SUM.group === "overall") {
    return [{ label: "All gauges", stats: statsFor(gs.map(g => g[SUM.metric])) }];
  }
  const key = SUM.group;                       // "so" or "kp"
  const buckets = new Map();
  for (const g of gs) {
    const v = g[key];
    if (v == null || v === "None" || v === "nan") continue;
    if (!buckets.has(v)) buckets.set(v, []);
    buckets.get(v).push(g[SUM.metric]);
  }
  const keys = [...buckets.keys()].sort((a, b) =>
    typeof a === "number" ? a - b : String(a).localeCompare(String(b)));
  return keys.map(k => ({
    label: key === "so" ? "Order " + k : String(k),
    stats: statsFor(buckets.get(k)),
  })).filter(r => r.stats);
}

// The month grouping can only show r, because r is the only metric computed
// per calendar month.
// For the month grouping the colour scale and number format come from whichever
// monthly metric is selected; otherwise from the whole-series metric picker.
const sumMetric = () => {
  if (SUM.group !== "month") return M[SUM.metric];
  const mo = MONTHLY.find(x => x.k === SUM.monthMetric) || MONTHLY[0];
  return M[mo.scale];
};

function barChart(rows, m) {
  const w = 760, rowH = 30, pl = 104, pr = 112, pt = 20, pb = 4;
  const h = pt + rows.length * rowH + pb;
  const svg = el("svg", { class: "chart", viewBox: `0 0 ${w} ${h}`, role: "img" });
  const iw = w - pl - pr;
  const X = v => pl + Math.max(0, Math.min(1, scalePos(m, v))) * iw;

  // axis
  [m.lo, m.dv != null ? m.dv : (m.lo + m.hi) / 2, m.hi].forEach(v => {
    if (v == null) return;
    const x = X(v);
    svg.appendChild(el("line", { x1: x, x2: x, y1: pt - 6, y2: h - pb,
      stroke: cssVar("--rule"), "stroke-width": 1 }));
    const t = el("text", { x, y: pt - 10, "text-anchor": "middle", "font-size": 9,
      fill: cssVar("--ink-3"), "font-family": "IBM Plex Mono, monospace" });
    t.textContent = m.log ? sig(v) : String(v); svg.appendChild(t);
  });
  if (m.k && m.k.startsWith("kge")) {
    const x = X(D.noSkill);
    svg.appendChild(el("line", { x1: x, x2: x, y1: pt - 6, y2: h - pb,
      stroke: cssVar("--ink-3"), "stroke-width": 1, "stroke-dasharray": "3 3" }));
  }

  rows.forEach((r, i) => {
    const y = pt + i * rowH, cy = y + rowH / 2;
    const lab = el("text", { x: pl - 12, y: cy + 4, "text-anchor": "end", "font-size": 12,
      fill: cssVar("--ink-2") });
    lab.textContent = r.label; svg.appendChild(lab);

    // interquartile whisker behind the median mark
    const x25 = X(r.stats.p25), x75 = X(r.stats.p75);
    svg.appendChild(el("line", { x1: x25, x2: x75, y1: cy, y2: cy,
      stroke: cssVar("--rule-2"), "stroke-width": 7, "stroke-linecap": "round" }));

    const base = X(m.dv != null ? m.dv : m.lo), xm = X(r.stats.med);
    svg.appendChild(el("rect", {
      x: Math.min(base, xm), y: cy - 5.5, width: Math.max(2, Math.abs(xm - base)), height: 11,
      rx: 3, fill: colorFor(m, r.stats.med),
      stroke: cssVar("--panel"), "stroke-width": 1 }));

    const val = el("text", { x: w - pr + 10, y: cy + 4, "font-size": 12, "font-weight": 500,
      fill: cssVar("--ink"), "font-family": "IBM Plex Mono, monospace" });
    val.textContent = fmt(r.stats.med, m.dec); svg.appendChild(val);
    const nn = el("text", { x: w - 4, y: cy + 4, "text-anchor": "end", "font-size": 10,
      fill: cssVar("--ink-3"), "font-family": "IBM Plex Mono, monospace" });
    nn.textContent = "n " + r.stats.n.toLocaleString(); svg.appendChild(nn);
  });
  return svg;
}

function polarChart(rows, m) {
  const size = 400, cx = size / 2, cy = size / 2, r0 = 34, r1 = 150;
  const svg = el("svg", { class: "chart", viewBox: `0 0 ${size} ${size}`,
                          preserveAspectRatio: "xMidYMid meet", role: "img" });
  // The radial axis spans the DATA, not the metric's theoretical range. On the
  // metric scale (-1..1) a spread of 0.32-0.53 lands every wedge at almost the
  // same radius, which hides the very contrast the chart exists to show. Colour
  // still uses the absolute metric scale, so it stays comparable with the map.
  const vals = rows.filter(r => r.stats).map(r => r.stats.med);
  let rlo = Math.min(0, ...vals), rhi = Math.max(...vals);
  if (!(rhi > rlo)) rhi = rlo + 1;
  rhi += (rhi - rlo) * 0.10;
  const R = v => r0 + Math.max(0, Math.min(1, (v - rlo) / (rhi - rlo))) * (r1 - r0);
  const pt = (ang, rad) => [cx + rad * Math.sin(ang), cy - rad * Math.cos(ang)];

  for (const frac of [0.25, 0.5, 0.75, 1]) {
    svg.appendChild(el("circle", { cx, cy, r: r0 + frac * (r1 - r0), fill: "none",
      stroke: cssVar("--rule"), "stroke-width": 1 }));
  }
  // Ring labels are drawn last, over the wedges, with a surface-coloured halo --
  // otherwise a wedge that happens to reach the top of the chart buries them.
  const ringLabels = [];
  for (const frac of [0.5, 1]) {
    const t = el("text", { x: cx + 5, y: cy - (r0 + frac * (r1 - r0)) - 3, "font-size": 9,
      fill: cssVar("--ink-3"), "font-family": "IBM Plex Mono, monospace",
      stroke: cssVar("--panel"), "stroke-width": 3, "paint-order": "stroke fill" });
    t.textContent = fmt(rlo + frac * (rhi - rlo), 2); ringLabels.push(t);
  }
  const step = 2 * Math.PI / rows.length, gap = step * 0.14;

  rows.forEach((row, i) => {
    const a0 = i * step - step / 2 + gap / 2, a1 = a0 + step - gap;
    const mid = (a0 + a1) / 2;
    if (row.stats) {
      const rad = R(row.stats.med);
      const [x0, y0] = pt(a0, r0), [x1, y1] = pt(a0, rad);
      const [x2, y2] = pt(a1, rad), [x3, y3] = pt(a1, r0);
      svg.appendChild(el("path", {
        d: `M${x0} ${y0} L${x1} ${y1} A${rad} ${rad} 0 0 1 ${x2} ${y2} L${x3} ${y3} `
         + `A${r0} ${r0} 0 0 0 ${x0} ${y0} Z`,
        fill: colorFor(m, row.stats.med), stroke: cssVar("--panel"), "stroke-width": 1 }));
      const [lx, ly] = pt(mid, rad + 13);
      const t = el("text", { x: lx, y: ly + 3.5, "text-anchor": "middle", "font-size": 10,
        fill: cssVar("--ink-2"), "font-family": "IBM Plex Mono, monospace" });
      t.textContent = fmt(row.stats.med, 2); svg.appendChild(t);
    }
    const [mx, my] = pt(mid, r1 + 34);
    const ml = el("text", { x: mx, y: my + 4, "text-anchor": "middle", "font-size": 11,
      "font-weight": 500, fill: cssVar("--ink-2") });
    ml.textContent = row.label; svg.appendChild(ml);
  });
  ringLabels.forEach(t => svg.appendChild(t));
  return svg;
}

function renderSummaryTab() {
  const host = document.getElementById("summary");
  const gs = D.gauges, kge = gs.map(g => g.kge_2012);
  const withSkill = kge.filter(v => v != null && v >= D.noSkill).length;
  const beatClim = gs.filter(g => g.ss_clim != null && g.ss_clim > 0).length;
  const nClim = gs.filter(g => g.ss_clim != null).length;
  // The MAE-based version of the same comparison. Reported alongside because the
  // two disagree at 13% of gauges on VPU 714 -- 53.8% beat climatology on squared
  // error, 62.4% on absolute error -- so "beats climatology" is not one number.
  const beatClimMae = gs.filter(g => g.ss_clim_mae != null && g.ss_clim_mae > 0).length;
  const nClimMae = gs.filter(g => g.ss_clim_mae != null).length;
  const rows = summaryRows(), m = sumMetric();
  const grp = GROUPINGS.find(g => g.k === SUM.group);

  host.innerHTML = `
    <div class="wrap">
      <div>
        <h2>VPU ${D.vpu} — overall performance</h2>
        <p class="lede">${runLabel()} against ${gs.length.toLocaleString()}
          observed gauges, daily mean on both sides. Every gauge is scored only on days
          where it and the model both have data.</p>
      </div>

      <section>
        <h3>Headline</h3>
        <div class="tiles">
          <div class="tile"><span class="k">Gauges</span>
            <span class="v num">${gs.length.toLocaleString()}</span>
            <span class="sub">median ${fmt(median(gs.map(yearsOf)), 0)} yr of paired record</span></div>
          <div class="tile"><span class="k">Median KGE'</span>
            <span class="v num">${fmt(median(kge))}</span>
            <span class="sub">no-skill line at ${D.noSkill}</span></div>
          <div class="tile"><span class="k">Beat a flat average</span>
            <span class="v num">${(100 * withSkill / gs.length).toFixed(0)}%</span>
            <span class="sub">${withSkill.toLocaleString()} of ${gs.length.toLocaleString()} gauges beat
              one constant number &#8212; the gauge's own mean flow, every day.
              KGE&#8242; &#8805; ${D.noSkill}</span></div>
          <div class="tile"><span class="k">Beat a seasonal average</span>
            <span class="v num">${nClim ? (100 * beatClim / nClim).toFixed(0) : "—"}%</span>
            <span class="sub">${beatClim.toLocaleString()} of ${nClim.toLocaleString()} gauges beat
              that calendar day's own average &#8212; a harder test, so the number is lower.
              Squared error; ${nClimMae ? (100 * beatClimMae / nClimMae).toFixed(0) : "—"}% on
              absolute error</span></div>
          <div class="tile"><span class="k">Median r</span>
            <span class="v num">${fmt(median(gs.map(g => g.r)))}</span>
            <span class="sub">&#947; ${fmt(median(gs.map(g => g.gamma)))} &#183;
              &#946; ${fmt(median(gs.map(g => g.beta)))}</span></div>
        </div>
      </section>

      <section>
        <h3>By grouping</h3>
        <div class="sumctl">
          <div class="ctl"><label for="sumGroup">Group by</label>
            <select id="sumGroup"></select></div>
          <div class="ctl" id="sumMetricCtl"><label for="sumMetric">Metric</label>
            <select id="sumMetric"></select></div>
        </div>
        <div id="sumChart"></div>
        <div class="chartcap" id="sumCap"></div>
        <div class="tblwrap" style="margin-top:16px">
          <table class="grid"><thead><tr>
            <th>${grp.n === "Overall" ? "Group" : grp.n}</th><th>n</th>
            <th>p05</th><th>p25</th><th>median</th><th>p75</th><th>p95</th>
          </tr></thead><tbody id="sumRows"></tbody></table>
        </div>
      </section>

      <section>
        <h3>All metrics, all gauges</h3>
        <div class="tblwrap">
          <table class="grid"><thead><tr>
            <th>Metric</th><th>n</th><th>p05</th><th>p25</th><th>median</th><th>p75</th><th>p95</th>
          </tr></thead><tbody id="allRows"></tbody></table>
        </div>
        <div class="chartcap">Percentiles are across gauges, not across days. Medians are
          reported rather than means because KGE', NSE and the ratios are unbounded below,
          so a handful of bad gauges would dominate any mean.</div>
      </section>
    </div>`;

  // controls
  const gSel = host.querySelector("#sumGroup");
  GROUPINGS.forEach(g => { const o = document.createElement("option");
    o.value = g.k; o.textContent = g.n; gSel.appendChild(o); });
  gSel.value = SUM.group;
  gSel.onchange = () => { SUM.group = gSel.value; renderSummaryTab(); };

  const mSel = host.querySelector("#sumMetric");
  METRICS.filter(x => !x.monthly).forEach(x => { const o = document.createElement("option");
    o.value = x.k; o.textContent = x.n; mSel.appendChild(o); });
  mSel.value = SUM.metric;
  mSel.onchange = () => { SUM.metric = mSel.value; renderSummaryTab(); };

  // Only three metrics exist per calendar month, so the month grouping gets its
  // own shorter list rather than the full whole-series one.
  if (SUM.group === "month") {
    mSel.innerHTML = "";
    MONTHLY.forEach(x => { const o = document.createElement("option");
      o.value = x.k; o.textContent = x.n; mSel.appendChild(o); });
    mSel.value = SUM.monthMetric;
    mSel.onchange = () => { SUM.monthMetric = mSel.value; renderSummaryTab(); };
  }

  const chartHost = host.querySelector("#sumChart");
  if (SUM.group === "month") {
    // A square chart should not stretch to the width of a wide window.
    const box = document.createElement("div");
    box.style.maxWidth = "440px";
    box.appendChild(polarChart(rows, m));
    chartHost.appendChild(box);
  } else {
    chartHost.appendChild(barChart(rows, m));
  }
  host.querySelector("#sumCap").textContent = SUM.group === "month"
    ? `Median ${m.n} within each calendar month, pooled across years. The radial axis spans `
      + `the data, not the metric's full range, so the differences are visible; ring labels give `
      + `the scale.`
    : `Median ${m.n} per group. The pale bar behind each median spans the 25th to 75th `
      + `percentile, so a wide bar means the gauges in that group disagree.`;

  const tb = host.querySelector("#sumRows");
  rows.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><span class="swatch" style="background:${colorFor(m, r.stats.med)}"></span>${r.full || r.label}</td>`
      + [r.stats.n.toLocaleString(), fmt(r.stats.p05, m.dec), fmt(r.stats.p25, m.dec),
         fmt(r.stats.med, m.dec), fmt(r.stats.p75, m.dec), fmt(r.stats.p95, m.dec)]
        .map(v => `<td class="num">${v}</td>`).join("");
    tb.appendChild(tr);
  });

  const ab = host.querySelector("#allRows");
  METRICS.filter(x => !x.monthly).forEach(x => {
    const st = statsFor(gs.map(g => g[x.k]));
    if (!st) return;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${x.n}</td>`
      + [st.n.toLocaleString(), fmt(st.p05, x.dec), fmt(st.p25, x.dec), fmt(st.med, x.dec),
         fmt(st.p75, x.dec), fmt(st.p95, x.dec)].map(v => `<td class="num">${v}</td>`).join("");
    ab.appendChild(tr);
  });
}

function showTab(which) {
  const isMap = which === "map";
  // Colour-by, month, record length, stream-order chips and the reset link all
  // act on the map only, so they would be dead controls on the summary tab.
  for (const id of ["metricCtl", "yrCtl", "orderCtl", "filtCtl"]) {
    const e = document.getElementById(id);
    if (e) e.hidden = !isMap;
  }
  document.querySelector(".split").hidden = !isMap;
  document.getElementById("summary").hidden = isMap;
  document.getElementById("tabMap").setAttribute("aria-pressed", String(isMap));
  document.getElementById("tabSum").setAttribute("aria-pressed", String(!isMap));
  // The map canvas has no size while hidden, so it must be re-measured on return.
  if (isMap) { fit(); draw(); drawHydro(); scheduleStreams(); } else { renderSummaryTab(); }
}

/* ---- resizable rail ------------------------------------------------------ */
// Width lives in a CSS variable and is remembered per browser. Wrapped in
// try/catch because localStorage throws outright in some embedding contexts.
const RAIL_MIN = 300, RAIL_MAX_FRAC = 0.72, RAIL_KEY = "gse.railWidth";

// Metric text tracks the panel width. At RAIL_MIN the tables are as tight as
// they were; widening the panel spends the space on legibility rather than on
// more whitespace. Linear between the two anchors and clamped at both ends, so
// a very wide panel does not end up with headline-sized numbers.
const KV_MIN = 14, KV_MAX = 19, GRID_MIN = 13, GRID_MAX = 16, RAIL_WIDE = 760;
function scaleRailText(w) {
  const t = Math.max(0, Math.min(1, (w - RAIL_MIN) / (RAIL_WIDE - RAIL_MIN)));
  const kv = KV_MIN + t * (KV_MAX - KV_MIN);
  const st = document.documentElement.style;
  st.setProperty("--kv-size", kv.toFixed(2) + "px");
  st.setProperty("--kv-pad", (4.5 + t * 2.5).toFixed(2) + "px");
  st.setProperty("--grid-size", (GRID_MIN + t * (GRID_MAX - GRID_MIN)).toFixed(2) + "px");
}

function setRailWidth(w, persist) {
  const max = Math.max(RAIL_MIN, Math.round(window.innerWidth * RAIL_MAX_FRAC));
  w = Math.max(RAIL_MIN, Math.min(max, Math.round(w)));
  document.documentElement.style.setProperty("--rail-w", w + "px");
  scaleRailText(w);
  if (persist) { try { localStorage.setItem(RAIL_KEY, String(w)); } catch (e) {} }
  fit(); draw(); drawHydro(); requestStreams();
  return w;
}

(function initRail() {
  let saved = null;
  try { saved = localStorage.getItem(RAIL_KEY); } catch (e) {}
  if (saved && isFinite(+saved)) setRailWidth(+saved, false);
  else scaleRailText(parseFloat(cssVar("--rail-w")) || RAIL_MIN);

  const gut = document.getElementById("gutter");
  if (!gut) return;
  let dragging = false;

  gut.addEventListener("pointerdown", e => {
    dragging = true; gut.classList.add("dragging");
    document.body.classList.add("resizing");
    gut.setPointerCapture(e.pointerId); e.preventDefault();
  });
  gut.addEventListener("pointermove", e => {
    if (dragging) setRailWidth(window.innerWidth - e.clientX, false);
  });
  const stop = () => {
    if (!dragging) return;
    dragging = false; gut.classList.remove("dragging");
    document.body.classList.remove("resizing");
    const cur = parseInt(getComputedStyle(document.documentElement)
      .getPropertyValue("--rail-w"), 10);
    if (isFinite(cur)) setRailWidth(cur, true);
  };
  gut.addEventListener("pointerup", stop);
  gut.addEventListener("pointercancel", stop);

  // Keyboard-accessible: the handle is focusable, arrows nudge it.
  gut.addEventListener("keydown", e => {
    const step = e.shiftKey ? 48 : 16;
    const cur = parseInt(getComputedStyle(document.documentElement)
      .getPropertyValue("--rail-w"), 10) || 384;
    if (e.key === "ArrowLeft")  { setRailWidth(cur + step, true); e.preventDefault(); }
    if (e.key === "ArrowRight") { setRailWidth(cur - step, true); e.preventDefault(); }
  });
  // Double-click restores the default.
  gut.addEventListener("dblclick", () => setRailWidth(384, true));
})();

/* ---- boot ---------------------------------------------------------------- */
async function boot() {
  syncRamp();
  if (EMBEDDED) {
    D = EMBEDDED;
  } else {
    try {
      D = await (await fetch("/api/gauges")).json();
    } catch (err) {
      document.getElementById("rail").innerHTML =
        `<div class="err">Could not reach the local API. Start it with
         <code>python serve.py</code> and open the address it prints.</div>`;
      return;
    }
  }

  const pctl = (a,p) => { const v = a.filter(x=>x!=null&&isFinite(x)&&x>0).sort((x,y)=>x-y);
    return v.length ? v[Math.min(v.length-1, Math.floor(p*(v.length-1)))] : null; };
  // Only for a log metric that declares no bounds. Deriving them from the data
  // makes the same value a different colour on every run, which quietly breaks
  // comparison between two pages -- the whole point of labelling runs. nrmse
  // therefore carries fixed lo/hi and does not come through here.
  // Metrics whose neutral point is the run's no-skill line, not zero.
  for (const m of METRICS) if (m.dvNoSkill) m.dv = D.noSkill;
  for (const m of METRICS) if (m.log && m.lo == null) {
    m.lo = pctl(D.gauges.map(g=>g[m.k]), 0.05) ?? 0.01;
    m.hi = pctl(D.gauges.map(g=>g[m.k]), 0.95) ?? 100;
  }

  [BX0, BY0, BX1, BY1] = D.bbox;
  KX = Math.cos((BY0+BY1)/2 * Math.PI/180);
  ORDERS = [...new Set(D.gauges.map(g=>g.so).filter(v=>v!=null))].sort((a,b)=>a-b);
  S.orders = new Set(ORDERS);

  document.getElementById("brandsub").textContent =
    `VPU ${D.vpu} · ${D.gauges.length.toLocaleString()} gauges · ${rawLabel()}`;
  // Put the run name in the browser tab too. Comparing two runs means two tabs,
  // and both would otherwise read "Gauge Skill Explorer".
  document.title = `${rawLabel()} — VPU ${D.vpu} — Gauge Skill Explorer`;

  const sel = document.getElementById("metric");
  METRICS.forEach(m => { const o = document.createElement("option");
    o.value = m.k; o.textContent = m.n; sel.appendChild(o); });
  sel.value = S.metric;
  sel.onchange = () => { S.metric = sel.value; renderLegend(); draw(); renderRail(); };

  const ordersEl = document.getElementById("orders");
  ORDERS.forEach(o => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = o; b.setAttribute("aria-pressed","true");
    b.onclick = () => {
      S.orders.has(o) ? S.orders.delete(o) : S.orders.add(o);
      if (!S.orders.size) S.orders.add(o);
      b.setAttribute("aria-pressed", String(S.orders.has(o)));
      if (S.sel && !S.orders.has(S.sel.so)) S.sel = null;
      draw(); renderRail();
    };
    ordersEl.appendChild(b);
  });

  const yr = document.getElementById("minyr"), yrOut = document.getElementById("minyrOut");
  yr.oninput = () => { S.minYears = +yr.value; yrOut.textContent = yr.value+" yr";
    if (S.sel && yearsOf(S.sel) < S.minYears) S.sel = null; draw(); renderRail(); };

  const sv = document.getElementById("showStreams");
  sv.onclick = () => {
    SV.on = !SV.on; sv.setAttribute("aria-pressed", String(SV.on));
    if (SV.on) requestStreams(); else draw();
  };
  const bad = document.getElementById("onlyBad");
  bad.onclick = () => { S.onlyBad = !S.onlyBad; bad.setAttribute("aria-pressed", String(S.onlyBad));
    if (S.sel && S.onlyBad && !(S.sel.kge_2012 < D.noSkill)) S.sel = null;
    draw(); renderRail(); };

  document.getElementById("reset").onclick = () => {
    S.minYears = 0; yr.value = 0; yrOut.textContent = "0 yr";
    S.onlyBad = false; bad.setAttribute("aria-pressed","false");
    S.orders = new Set(ORDERS);
    [...ordersEl.children].forEach(b => b.setAttribute("aria-pressed","true"));
    S.sel = null; view.s = 1; view.tx = 0; view.ty = 0;
    draw(); renderRail();
  };

  const want = /^#g=(\d+)$/.exec(location.hash || "");
  if (want) S.sel = D.gauges.find(g => g.id === +want[1]) || null;

  document.getElementById("tabMap").onclick = () => showTab("map");
  document.getElementById("tabSum").onclick = () => showTab("summary");

  // Requested here rather than only from setRailWidth(): initRail() calls that
  // ONLY when a panel width is already in localStorage, so on a first visit the
  // streams were never asked for until the viewer happened to pan or zoom. This
  // is also the first point at which D exists, which requestStreams() requires.
  fit(); renderLegend(); draw(); renderRail(); requestStreams();
}

window.addEventListener("resize", () => { fit(); draw(); drawHydro(); });
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)")
  .addEventListener?.("change", () => { syncRamp(); renderLegend(); draw(); renderRail(); });
new MutationObserver(() => { syncRamp(); renderLegend(); draw(); renderRail(); })
  .observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
if (document.fonts?.ready) document.fonts.ready.then(() => { fit(); draw(); drawHydro(); });

boot();
})();
</script>
